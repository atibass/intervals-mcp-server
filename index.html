<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Web Demo</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0d12;--card:#11151d;--line:#222938;--text:#f5f7fb;--muted:#929bad;--accent:#8bd3ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#172131 0,transparent 32%),radial-gradient(circle at 80% 90%,#141e28 0,transparent 30%),var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);padding:24px}
    .card{width:min(620px,100%);background:rgba(17,21,29,.82);border:1px solid var(--line);border-radius:28px;padding:28px;backdrop-filter:blur(18px);box-shadow:0 24px 80px rgba(0,0,0,.35)}
    .top{display:flex;align-items:center;justify-content:space-between;gap:16px}.badge{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#b7c1d1}.dot{width:9px;height:9px;border-radius:50%;background:#66e3a4;box-shadow:0 0 16px #66e3a4}
    h1{font-size:clamp(32px,8vw,58px);line-height:1;margin:56px 0 16px;letter-spacing:-.055em}.sub{color:var(--muted);font-size:17px;line-height:1.65;max-width:42ch}
    .panel{margin-top:34px;padding:18px;border:1px solid var(--line);border-radius:20px;background:rgba(9,12,17,.55)}
    .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}.time{font-size:28px;font-variant-numeric:tabular-nums;margin-top:8px}
    button{margin-top:18px;width:100%;border:0;border-radius:16px;padding:15px 18px;background:var(--text);color:#0a0c10;font-size:15px;font-weight:700;cursor:pointer}button:active{transform:scale(.99)}
    .count{margin-top:12px;text-align:center;color:var(--muted);font-size:13px}
    footer{margin-top:26px;color:#667084;font-size:12px}
  </style>
</head>
<body>
  <main class="card">
    <div class="top"><strong>atibass / demo</strong><span class="badge"><span class="dot"></span>ONLINE</span></div>
    <h1>Deploy สำเร็จ.</h1>
    <p class="sub">นี่คือเว็บทดสอบง่าย ๆ ที่ถูก deploy จาก GitHub branch แยก โดยไม่แตะ Raspberry Pi และไม่กระทบ branch หลักของโปรเจกต์เดิม</p>
    <section class="panel">
      <div class="label">เวลาบนอุปกรณ์ของคุณ</div>
      <div class="time" id="time">--:--:--</div>
      <button id="btn">กดทดสอบ JavaScript</button>
      <div class="count" id="count">ยังไม่ได้กด</div>
    </section>
    <footer>Static HTML · Nginx · Railway</footer>
  </main>
  <script>
    const time=document.getElementById('time'),btn=document.getElementById('btn'),count=document.getElementById('count');
    let n=0;
    const tick=()=>time.textContent=new Date().toLocaleTimeString('th-TH',{hour12:false});
    tick();setInterval(tick,1000);
    btn.addEventListener('click',()=>{n++;count.textContent=`กดแล้ว ${n} ครั้ง — JavaScript ทำงานปกติ`;});
  </script>
</body>
</html>
